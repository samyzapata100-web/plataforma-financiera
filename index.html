<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINÉA - Acceso</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        /* =====================================================
           ANIMACIÓN DE INTRO
        ===================================================== */

        .anim-logo-intro {
            opacity: 0;
            animation: zoomInLogo 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.2s;
        }

        .anim-linea {
            height: 0;
            animation: growLine 0.7s ease-out forwards;
            animation-delay: 1.1s;
        }

        .anim-texto-brand {
            opacity: 0;
            transform: translateX(-12px);
            animation: revealText 0.8s ease-out forwards;
            animation-delay: 1.5s;
        }

        @keyframes zoomInLogo {
            0% {
                opacity: 0;
                transform: scale(0.6);
                filter: blur(6px);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        @keyframes growLine {
            0% {
                height: 0;
            }

            100% {
                height: 50px;
            }
        }

        @keyframes revealText {
            0% {
                opacity: 0;
                transform: translateX(-12px);
                filter: blur(4px);
            }

            100% {
                opacity: 1;
                transform: translateX(0);
                filter: blur(0);
            }
        }

        .fade-out-intro {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .fade-in-element {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =====================================================
           TRANSICIONES ENTRE FORMULARIOS
        ===================================================== */

        .formulario {
            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        .oculto {
            display: none;
        }

        .entrada-error {
            border-color: rgb(239 68 68) !important;
            box-shadow: 0 0 0 1px rgb(239 68 68 / 0.2);
        }

        .mensaje {
            animation: aparecerMensaje 0.3s ease forwards;
        }

        @keyframes aparecerMensaje {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =====================================================
           BOTÓN MOSTRAR CONTRASEÑA
        ===================================================== */

        .btn-password {
            transition: color 0.2s ease;
        }

        .btn-password:hover {
            color: rgb(251 191 36);
        }

    </style>
</head>

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /* =====================================================
           INTRODUCCIÓN
        ===================================================== */

        setTimeout(() => {

            const intro = document.getElementById("pantalla-intro");
            const tarjeta = document.getElementById("tarjeta-login");

            intro.classList.add("fade-out-intro");

            setTimeout(() => {

                tarjeta.classList.remove("opacity-0");
                tarjeta.classList.add("fade-in-element");

            }, 300);

        }, 3400);



        /* =====================================================
           CAMBIAR A REGISTRO
        ===================================================== */

        function mostrarRegistro() {

            limpiarMensaje();

            document.getElementById("form-login").classList.add("oculto");

            document.getElementById("form-registro").classList.remove("oculto");

        }



        /* =====================================================
           CAMBIAR A LOGIN
        ===================================================== */

        function mostrarLogin() {

            limpiarMensaje();

            document.getElementById("form-registro").classList.add("oculto");

            document.getElementById("form-login").classList.remove("oculto");

        }



        /* =====================================================
           REGISTRAR USUARIO
        ===================================================== */

        function registrarUsuario(event) {

            event.preventDefault();

            limpiarMensaje();


            const nombre =
                document.getElementById("registro-nombre").value.trim();

            const apellido =
                document.getElementById("registro-apellido").value.trim();

            const usuario =
                document.getElementById("registro-usuario").value.trim();

            const correo =
                document.getElementById("registro-correo").value.trim();

            const password =
                document.getElementById("registro-password").value;

            const confirmar =
                document.getElementById("registro-confirmar").value;



            /* VALIDAR CAMPOS */

            if (!nombre || !apellido || !usuario || !correo || !password || !confirmar) {

                mostrarMensaje(
                    "Por favor, completa todos los campos.",
                    "error"
                );

                return;
            }



            /* VALIDAR USUARIO */

            const usuarioValido =
                /^[a-zA-Z0-9._-]+$/.test(usuario);

            if (!usuarioValido) {

                mostrarMensaje(
                    "El usuario solo puede contener letras, números, puntos, guiones y guiones bajos.",
                    "error"
                );

                return;
            }



            /* VALIDAR CONTRASEÑA */

            if (password.length < 6) {

                mostrarMensaje(
                    "La contraseña debe tener al menos 6 caracteres.",
                    "error"
                );

                return;
            }



            /* CONFIRMAR CONTRASEÑA */

            if (password !== confirmar) {

                mostrarMensaje(
                    "Las contraseñas no coinciden.",
                    "error"
                );

                return;
            }



            /* OBTENER CUENTA EXISTENTE */

            const cuentaGuardada =
                localStorage.getItem("finea_cuenta");

            if (cuentaGuardada) {

                const cuenta =
                    JSON.parse(cuentaGuardada);


                if (
                    cuenta.usuario.toLowerCase() ===
                    usuario.toLowerCase()
                ) {

                    mostrarMensaje(
                        "Ese nombre de usuario ya está registrado.",
                        "error"
                    );

                    return;
                }


                if (
                    cuenta.correo.toLowerCase() ===
                    correo.toLowerCase()
                ) {

                    mostrarMensaje(
                        "Ese correo electrónico ya está registrado.",
                        "error"
                    );

                    return;
                }

            }



            /* CREAR CUENTA */

            const nuevaCuenta = {

                nombre: nombre,

                apellido: apellido,

                usuario: usuario,

                correo: correo,

                password: password

            };


            localStorage.setItem(
                "finea_cuenta",
                JSON.stringify(nuevaCuenta)
            );



            /* GUARDAR SESIÓN */

            sessionStorage.setItem(
                "usuarioFinea",
                nombre
            );

            sessionStorage.setItem(
                "usuarioCompletoFinea",
                JSON.stringify(nuevaCuenta)
            );



            mostrarMensaje(
                "¡Cuenta creada correctamente! Ingresando a FINÉA...",
                "success"
            );



            /* ENTRAR AL MENÚ */

            setTimeout(() => {

                window.location.href = "menu.html";

            }, 1000);

        }



        /* =====================================================
           INICIAR SESIÓN
        ====================================================== */

        function iniciarSesion(event) {

            event.preventDefault();

            limpiarMensaje();


            const identificador =
                document.getElementById("login-usuario")
                .value
                .trim();

            const password =
                document.getElementById("login-password")
                .value;



            /* BUSCAR CUENTA */

            const cuentaGuardada =
                localStorage.getItem("finea_cuenta");


            if (!cuentaGuardada) {

                mostrarMensaje(
                    "No existe una cuenta registrada. Primero debes crear una cuenta.",
                    "error"
                );

                return;
            }



            const cuenta =
                JSON.parse(cuentaGuardada);



            /* COMPROBAR USUARIO O CORREO */

            const identificadorCorrecto =

                cuenta.usuario.toLowerCase() ===
                identificador.toLowerCase()

                ||

                cuenta.correo.toLowerCase() ===
                identificador.toLowerCase();



            if (!identificadorCorrecto) {

                mostrarMensaje(
                    "El usuario o correo electrónico no es correcto.",
                    "error"
                );

                return;
            }



            /* COMPROBAR CONTRASEÑA */

            if (cuenta.password !== password) {

                mostrarMensaje(
                    "La contraseña ingresada no es correcta.",
                    "error"
                );

                return;
            }



            /* GUARDAR SESIÓN */

            sessionStorage.setItem(
                "usuarioFinea",
                cuenta.nombre
            );

            sessionStorage.setItem(
                "usuarioCompletoFinea",
                JSON.stringify(cuenta)
            );



            mostrarMensaje(
                "Inicio de sesión correcto. Bienvenido/a a FINÉA.",
                "success"
            );



            /* IR AL MENÚ */

            setTimeout(() => {

                window.location.href = "menu.html";

            }, 700);

        }



        /* =====================================================
           MOSTRAR / OCULTAR CONTRASEÑA
        ====================================================== */

        function mostrarPassword(inputId, iconId) {

            const input =
                document.getElementById(inputId);

            const icon =
                document.getElementById(iconId);


            if (input.type === "password") {

                input.type = "text";

                icon.classList.remove("fa-eye");

                icon.classList.add("fa-eye-slash");

            } else {

                input.type = "password";

                icon.classList.remove("fa-eye-slash");

                icon.classList.add("fa-eye");

            }

        }



        /* =====================================================
           MENSAJES
        ====================================================== */

        function mostrarMensaje(texto, tipo) {

            const mensaje =
                document.getElementById("mensaje");


            mensaje.textContent = texto;

            mensaje.classList.remove(
                "hidden",
                "bg-red-950/50",
                "border-red-500/30",
                "text-red-300",
                "bg-emerald-950/50",
                "border-emerald-500/30",
                "text-emerald-300"
            );


            if (tipo === "error") {

                mensaje.classList.add(
                    "bg-red-950/50",
                    "border",
                    "border-red-500/30",
                    "text-red-300"
                );

            } else {

                mensaje.classList.add(
                    "bg-emerald-950/50",
                    "border",
                    "border-emerald-500/30",
                    "text-emerald-300"
                );

            }

        }



        function limpiarMensaje() {

            const mensaje =
                document.getElementById("mensaje");

            mensaje.classList.add("hidden");

            mensaje.textContent = "";

        }

    </script>

</body>
